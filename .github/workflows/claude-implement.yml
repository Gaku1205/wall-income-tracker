# 実装AI：Issueに「ai:implement」ラベルを付けると、Claudeがブランチを切って実装する。
# 終わるとIssueにコメントが付き、PRを自動で作る（PIPELINE_TOKEN が無ければ人間がPRを作る）。
# そのあとは pipeline.yml が CI → レビュー → マージ と進める。
#
# モデルはIssueのサイズラベルで切り替える（ラベルは ai:implement より先に付ける）
#   size:S → haiku（文言修正など小さい作業）
#   なし   → sonnet（普段の作業）
#   size:L → opus（設計が絡む大きい作業）
# ターン上限もサイズで変える（S:40 / 無印:60 / L:100）。上限は暴走止めなので、普通の作業は上限より手前で終わる
name: Claude Implement

on:
  issues:
    types: [labeled]

jobs:
  implement:
    # テンプレート本体の「新サービス：」のIssueは工場（factory.yml）が受け持つ。ラベルが付いても、テンプレート自身には作らない
    if: >-
      github.event.label.name == 'ai:implement' &&
      !(github.event.repository.is_template && (startsWith(github.event.issue.title, '新サービス：') || startsWith(github.event.issue.title, '新サービス:')))
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.claude.outcome }}
    timeout-minutes: 30
    concurrency:
      group: claude-implement-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      MODEL: ${{ contains(github.event.issue.labels.*.name, 'size:S') && 'haiku' || (contains(github.event.issue.labels.*.name, 'size:L') && 'opus' || 'sonnet') }}
      MAX_TURNS: ${{ contains(github.event.issue.labels.*.name, 'size:S') && '40' || (contains(github.event.issue.labels.*.name, 'size:L') && '100' || '60') }}
    steps:
      # 履歴も全部取る（push の前に main を取り込むため。下の --append-system-prompt）
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # 言語の実行環境と依存を入れる（pipeline.json に合わせる。無ければ今までの Node 22・npm ci）
      - name: 実行環境をそろえる
        id: stack
        uses: ./.github/actions/setup-stack
      # 見た目のテストがあるアプリでは、AIも手元で見た目のテストを動かして確かめられるようにする（位置や数値を測るテストを直すため）
      - name: 見た目のテストがあるか
        id: visual
        run: |
          enabled=false
          if [ -n "${{ steps.stack.outputs.node }}" ] && [ -f package.json ]; then
            enabled=$(jq -r '.scripts["test:visual"] != null' package.json)
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          # AIに許すコマンド（見た目のテストを動かすだけ。基準の画像の撮り直しは --disallowedTools で止める）
          if [ "$enabled" = true ]; then echo "allowed=Bash(npm run test:visual),Bash(npm run test:visual -- -g:*)" >> "$GITHUB_OUTPUT"; else echo "allowed=" >> "$GITHUB_OUTPUT"; fi
      - name: 見た目のテスト用のブラウザを入れる
        if: steps.visual.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium
      # パイプラインの App（ボット）がラベル・コメントで起こした実行を、AIのアクションが断らないようにする。
      # AI自身（claude[bot]）は許さない（自分のコメントで自分を呼ぶ繰り返しを防ぐ）。Secret は使わない
      - name: 起こしたボットを許可に入れる
        id: bots
        env:
          SENDER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          list=""
          if [ "$SENDER_TYPE" = Bot ] && [ "$SENDER" != "claude[bot]" ]; then
            list="${SENDER},${SENDER%\[bot\]}"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        id: claude
        continue-on-error: true
        with:
          allowed_bots: ${{ steps.bots.outputs.list }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "ai:implement"
          claude_args: "--model ${{ env.MODEL }} --max-turns ${{ env.MAX_TURNS }} --allowedTools \"${{ steps.stack.outputs.allowed }},${{ steps.visual.outputs.allowed }},Bash(.github/scripts/tests/run-all.sh),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git fetch:*),Bash(git merge:*),Bash(git push:*),Bash(bash .github/scripts/tests/run-all.sh),Bash(shellcheck:*),Skill\" --disallowedTools \"Bash(npm run test:visual -- --update-snapshots:*),Bash(npm run test:visual -- -u:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git rebase:*)\" --append-system-prompt \"push の前に、git fetch origin main と git merge origin/main で最新の main を取り込んでから、確認コマンドをもう一度通して push する。作業中に main のワークフローが更新されると、古い main のままの push は GitHub に拒否されるため。コンフリクトしたら両方の変更を残して解消する。.github/ のファイルは自分では変えない。\""
      # AIの結果（実行記録）を、データとして次のジョブに渡す。ここでは Secret を使わない
      - name: AIの結果を取っておく
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/ai-result"
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then cp "$EXECUTION_FILE" "$RUNNER_TEMP/ai-result/execution.json"; fi
          touch "$RUNNER_TEMP/ai-result/.keep"
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: ai-result
          path: ${{ runner.temp }}/ai-result
          include-hidden-files: true
          retention-days: 3

  open-pr:
    # 安全のため別のジョブにする：AIが作業フォルダのスクリプトを書き換えても、ここでは main の版を動かす。
    # PIPELINE_TOKEN を使うのはこのジョブだけ（AIのジョブには渡さない）
    needs: implement
    # AIのジョブが動いたときだけ（別のラベルが付いたときなど、AIのジョブが飛ばされたら何もしない）
    if: ${{ !cancelled() && needs.implement.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # 秘密鍵を PKCS#8 にそろえる（create-github-app-token は Node 24 だと「BEGIN RSA PRIVATE KEY」の形式を読めず Invalid keyData になる）
      - name: パイプラインの鍵の秘密鍵をそろえる
        id: app-key
        if: vars.PIPELINE_APP_ID != ''
        continue-on-error: true
        env:
          KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
        run: |
          # 貼るときに改行が消えて1行になっていても、頭と終わりの行と中身から組み立て直す
          k=$(printf '%s' "$KEY" | tr -d '\r'); k=${k//\\n/$'\n'}
          type=$(printf '%s' "$k" | grep -oE 'BEGIN [A-Z ]*PRIVATE KEY' | head -1 | sed 's/^BEGIN //')
          # 頭と終わりの行が抜けていたら、GitHub App の鍵の形式（RSA）とみなす
          [ -n "$type" ] || type="RSA PRIVATE KEY"
          body=$(printf '%s' "$k" | sed -e 's/-----BEGIN [A-Z ]*PRIVATE KEY-----//' -e 's/-----END [A-Z ]*PRIVATE KEY-----//' | tr -d ' \n\t"')
          pem=$(printf -- '-----BEGIN %s-----\n%s\n-----END %s-----\n' "$type" "$(printf '%s' "$body" | fold -w 64)" "$type" | openssl pkey 2> /dev/null) \
            || { b=no; e=no; case "$k" in *"-----BEGIN"*) b=yes;; esac; case "$k" in *"-----END"*) e=yes;; esac
                 echo "::error::PIPELINE_APP_PRIVATE_KEY を秘密鍵として読めません（.pem の中身を -----BEGIN から -----END まで全部貼る）。手がかり：全体 ${#KEY} 文字・$(printf '%s\n' "$KEY" | wc -l) 行・BEGIN の行 $b・END の行 $e・中身 ${#body} 文字（2048ビットの鍵なら中身は約1,600文字）"; exit 1; }
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$pem"
          { echo 'pem<<PEM_END'; echo "$pem"; echo 'PEM_END'; } >> "$GITHUB_OUTPUT"
      # パイプラインの鍵：GitHub App があれば、その1時間だけの鍵を使う（回数制限がオーナーと別・期限切れなし）。無ければ PIPELINE_TOKEN
      - name: パイプラインの鍵を作る
        id: app-token
        if: steps.app-key.outputs.pem != ''
        # 鍵が作れなくても（秘密鍵の貼り間違いなど）止めずに PIPELINE_TOKEN で続ける。Doctor が ❌ で知らせる
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PIPELINE_APP_ID }}
          private-key: ${{ steps.app-key.outputs.pem }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: ai-result
          path: ${{ runner.temp }}/ai-result
      - name: PRを作る（作業回数の上限で止まっても、変更があればPRにしてCIで確かめる）
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PIPELINE_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
          AGENT_DESK_URL: ${{ vars.AGENT_DESK_URL }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          AI_OUTCOME: ${{ needs.implement.outputs.outcome }}
          EXECUTION_FILE: ${{ runner.temp }}/ai-result/execution.json
        run: .github/scripts/open-pr.sh
