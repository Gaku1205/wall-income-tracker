# 工場：ai-dev-template に「新サービス：〜」で始まるIssueを1行書くと、新しいサービスのリポジトリを作って、いつものパイプラインに渡す。
#   例：「新サービス：毎朝の天気と予定を1枚で見られるページ」
# 名前・言語（Next.js か Python）・1行の説明をAIが決め、Next.js ならデザイン部門が使う場面の分析からデザイン仕様を書き（作品・体験の型なら GSAP・Lenis も選ぶ）、あとは factory.sh が行う（リポジトリ作成・秘密と変数のコピー・
# Vercel・main の保護・最初のIssue）。最初の1回だけ、Environment「factory」に FACTORY_TOKEN（と、Next.js を公開するなら VERCEL_TOKEN）の登録が要る（docs/pipeline.md「工場」）。
# テンプレート本体でだけ、オーナーが書いたIssueでだけ動く（公開リポジトリなので、ほかの人のIssueでは動かない）。
name: Factory

on:
  issues:
    types: [opened]

jobs:
  plan:
    if: >-
      github.event.repository.is_template &&
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '新サービス：') || startsWith(github.event.issue.title, '新サービス:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    outputs:
      name: ${{ steps.check.outputs.name }}
      stack: ${{ steps.check.outputs.stack }}
      desc: ${{ steps.check.outputs.desc }}
      memo: ${{ steps.check.outputs.memo }}
      detail: ${{ steps.memo.outputs.detail }}
    steps:
      # 工場のIssueの印。題が書き換えられても、テンプレート自身で企画・実装が走らないようにする（claude-plan.yml・claude-implement.yml が見る）
      - name: 工場の印を付ける
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels" -f "labels[]=factory" > /dev/null || echo "::warning::factory の印を付けられませんでした"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: メモを取り出す
        id: memo
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          memo="${TITLE#新サービス：}"; memo="${memo#新サービス:}"; memo="$(printf '%s' "$memo" | sed 's/^[[:space:]]*//')"
          { echo 'memo<<MEMO_END'; printf '%s\n' "$memo"; echo 'MEMO_END'; } >> "$GITHUB_OUTPUT"
          # Issue の本文は「詳しいメモ」（載せたい中身・見た目のスタイルなど。任意、3000文字まで）
          detail="$(printf '%s' "$BODY" | tr -d '\r' | grep -v '^DETAIL_END$' | head -c 3000 | iconv -c -f utf-8 -t utf-8)"
          { echo 'detail<<DETAIL_END'; printf '%s\n' "$detail"; echo 'DETAIL_END'; } >> "$GITHUB_OUTPUT"
      # AIは名前・言語・説明を決めて、ファイルに書くだけ（ほかの操作は許さない。鍵も渡さない）
      - uses: anthropics/claude-code-action@v1
        id: claude
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            オーナーが、新しく作りたいサービスを1行のメモに書きました。
            メモ：${{ steps.memo.outputs.memo }}
            詳しいメモ（あれば）：
            ${{ steps.memo.outputs.detail }}

            このサービスのリポジトリを作るために、次の3つを決め、`factory-plan.json` に JSON で書いてください（ほかのファイルは作らない）。
            {"name": "...", "stack": "...", "description": "..."}
            - name：リポジトリの名前。中身が分かる短い英語を、小文字の英数字と - でつなぐ（3〜39文字、先頭は英字。例：morning-board、receipt-sorter）
            - stack：nextjs か python
              - 人が画面で使うWebのサービス（ページ・ダッシュボード・ツール）なら nextjs
              - 画面よりも処理が中心の物（API・データ処理・機械学習・定期的に動く処理）なら python
              - 迷ったら nextjs
            - description：何のサービスかを、日本語で1文（120文字以内。改行・バッククォートは使わない）
          claude_args: '--model sonnet --max-turns 5 --allowedTools "Write"'
      - name: AIが決めた物を確かめる
        id: check
        env:
          MEMO: ${{ steps.memo.outputs.memo }}
        run: |
          f=factory-plan.json
          if [ ! -f "$f" ] || [ -L "$f" ] || ! jq -e 'type == "object"' "$f" > /dev/null 2>&1; then
            echo "::error::AIが factory-plan.json を書きませんでした"; exit 1
          fi
          name=$(jq -r '.name // ""' "$f"); stack=$(jq -r '.stack // ""' "$f"); desc=$(jq -r '.description // ""' "$f" | tr -d '\n`')
          [[ "$name" =~ ^[a-z][a-z0-9-]{2,38}$ ]] || { echo "::error::名前「$name」の形が違います"; exit 1; }
          case "$stack" in nextjs | python) ;; *) echo "::error::言語「$stack」は nextjs か python"; exit 1 ;; esac
          [ -n "$desc" ] || { echo "::error::説明がありません"; exit 1; }
          desc="${desc:0:120}"
          echo "名前：$name／言語：$stack／説明：$desc"
          { echo "name=$name"; echo "stack=$stack"; echo "desc<<DESC_END"; echo "$desc"; echo "DESC_END";
            echo "memo<<MEMO_END"; printf '%s\n' "$MEMO"; echo "MEMO_END"; } >> "$GITHUB_OUTPUT"

  # デザイン部門（Next.js のときだけ）：.github/factory/design-department.md。決まりは最低限（読める・押せる・止められる）にして、大胆な方向を取らせる。
  # 1. デザイン部門が、場面を短く分析して方向を決め、主な場面の試作を HTML で描いて撮り、画像を見て直してから、短い仕様を書く
  #    （写真は fetch-photos.sh で CC0・パブリックドメインの物だけ。3D・動きの道具は factory-libs.txt で頼む）
  # 2. 審査役（別のAI）が、仕様・HTML・前の採点を隠した状態で、画像だけを見て厳しく採点する。8点に届かなければ、指摘をつけてデザイン部門に戻す（最大2回）
  # 試作・画像・使った写真は docs/design-ref/ と public/photos/ に入り、実装の目標になる。
  # AIはファイルを書くだけ（鍵は持たない）。書いた物は build ジョブが形を確かめてから使う
  design:
    needs: plan
    if: needs.plan.outputs.stack == 'nextjs'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # taste-skill の draw.mjs・inspect.mjs と撮影（shot.mjs）は Node 22 以上が要る。撮影は ubuntu-latest に入っている Chrome を使う
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # AIが動かしてよいスクリプト（draw.mjs・inspect.mjs・shot.mjs・fetch-photos.sh）や手順書を、AI自身が書き換えられないようにする
      - name: スキルと手順書を読み取り専用にする
        run: chmod -R a-w .claude/skills .github
      # 撮影（shot.mjs・inspect.mjs）で Chrome を動かす。Ubuntu 24.04 は、Chrome の安全な囲い（sandbox）に要る仕組みを止めていることがあるので、使えるようにする
      - name: 撮影の準備
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 > /dev/null 2>&1 || true
          google-chrome --version || echo "::warning::Chrome が見つかりません（試作を撮れないので、デザイン部門は文章だけで決めます）"
      - uses: anthropics/claude-code-action@v1
        id: designer
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはこのサービスのアートディレクター兼デザイナーです。新しく作るWebサービスの見た目を決めてください。
            - サービス名：${{ needs.plan.outputs.name }}
            - 説明：${{ needs.plan.outputs.desc }}
            - 元のメモ：${{ needs.plan.outputs.memo }}
            - 詳しいメモ（載せたい中身・見た目のスタイルなど。あればこれも守る）：
              ${{ needs.plan.outputs.detail }}

            手順：
            1. `.github/factory/design-department.md`（進め方。短い）を全部読む。スキル frontend-design（`.claude/skills/frontend-design/SKILL.md`）も読む
            2. 進め方のとおりに、場面を短く分析し、方向を決め、素材（写真・シェーダー・3D）を考え、主な場面の試作を `factory-proto/NN-<英小文字の名前>.html` に描く
            3. `node .github/scripts/shot.mjs --out factory-proto/shots factory-proto/*.html` で撮り、画像を全部 Read で見て、自分に厳しく直す（最大3回）。画像を見ないまま次に進まない
            4. 進め方の「仕様を書く」のとおりに、短いデザイン仕様を `factory-design.md` に書く（1行目は `# デザイン仕様`、すぐ下に「目標の絵」）
            5. 「使う人」と「使う場面」を、2〜4行の箇条書きで `factory-context.md` に書く（仕様書の「前提」に入る）
            6. 3D・動きの道具を使うときだけ、`factory-libs.txt` に1行1つで書く
            このあと、別のAI（審査役）が画像だけで採点します。ほかのファイルは作らない・変えない（`factory-proto/` は試作・写真・画像の置き場。`.taste-skill/` は作業用で残らない）。
          claude_args: '--model opus --max-turns 120 --allowedTools "Read,Write,Edit,Glob,Grep,Skill,WebSearch,WebFetch,Bash(node .claude/skills/taste-skill/scripts/draw.mjs:*),Bash(node .claude/skills/taste-skill/scripts/inspect.mjs:*),Bash(node .github/scripts/shot.mjs:*),Bash(.github/scripts/fetch-photos.sh:*)"'
      # 審査役 1 回目：仕様・試作の HTML・前の採点を隠して、画像だけを見せる（作った側の意図を読み込ませない）
      - name: 審査役に見せない物を隠す（1 回目）
        id: hide1
        if: steps.designer.outcome == 'success'
        run: .github/scripts/factory-blind.sh hide
      - uses: anthropics/claude-code-action@v1
        id: critic1
        continue-on-error: true
        if: steps.hide1.outcome == 'success'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは、厳しいことで知られるアートディレクターです。新しいWebサービスの試作を、**画像だけ**で審査してください。
            作った人の説明・仕様・コードは見せません（見ないでください。開いてよいのは `factory-proto/shots/` の画像と `factory-proto/photos/` の写真だけ）。
            - サービス名：${{ needs.plan.outputs.name }}
            - 説明：${{ needs.plan.outputs.desc }}
            - 元のメモ：${{ needs.plan.outputs.memo }}
            - 詳しいメモ（載せたい中身・見た目のスタイルなど。あればこれも守る）：
              ${{ needs.plan.outputs.detail }}

            手順：
            1. `factory-proto/shots/` の画像を全部 Read で見る（名前の末尾が幅：390 はスマホ、1440・1920 は PC）
            2. 賞を取るサイト（Awwwards の Site of the Day）と並べたつもりで、10点満点で採点する。目安：
               9＝賞を取る／8＝プロの仕事で、記憶に残る／7＝きれいだが既視感がある／6＝テンプレートっぽい／5以下＝AIが作った感・素人っぽい
               見る所：一目で何のサイトか・誰のための物か／主役が強いか／構図と余白と揃い／文字の質と階層／色と質感（安っぽいぼかし・のっぺりした面・ありがちな飾りは減点）／
               題材らしさ（ほかのサービスに名前を変えても成り立つなら減点）／スマホでも成立するか／メモで見た目のスタイルが指定されていれば、本当にそのスタイルに見えるか
               甘くしない。迷ったら低い方にする
            3. `factory-critique.md` に書く（このファイルだけを書く）。形：
               1行目 `点数: 7.5`（数字だけ）、2行目 `判定: 通す`（8.0 以上）か `判定: 直す`（8.0 未満）
               そのあと `## 直すこと` に、効く順に最大6個。どの画像の・どこが・なぜだめで・どう変えるとよいかを具体的に。方向そのものが弱いなら、1個目にそう書く
          claude_args: '--model opus --max-turns 25 --allowedTools "Read,Glob,Write"'
      - name: 隠した物を戻して、点数を読む（1 回目）
        id: judge1
        if: always() && steps.hide1.outcome == 'success'
        run: |
          .github/scripts/factory-blind.sh restore
          score=$(grep -m1 -E '^点数' factory-critique.md 2> /dev/null | grep -oE '[0-9]+(\.[0-9]+)?' | head -1)
          echo "審査役の点数：${score:-なし}"
          # 点数が読めない（審査役が失敗した）ときは、直しに回さずに進める
          if [ -n "$score" ] && awk -v s="$score" 'BEGIN { exit !(s < 8.0) }'; then echo "redo=true" >> "$GITHUB_OUTPUT"; else echo "redo=false" >> "$GITHUB_OUTPUT"; fi
      - uses: anthropics/claude-code-action@v1
        id: fix1
        continue-on-error: true
        if: steps.judge1.outputs.redo == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはこのサービスのデザイン部門です。描いた試作を、仕様も見ない別のAI（審査役）が画像だけで審査し、8点に届きませんでした。
            - サービス名：${{ needs.plan.outputs.name }}
            - 説明：${{ needs.plan.outputs.desc }}
            - 元のメモ：${{ needs.plan.outputs.memo }}
            - 詳しいメモ（載せたい中身・見た目のスタイルなど。あればこれも守る）：
              ${{ needs.plan.outputs.detail }}

            1. `.github/factory/design-department.md` の「審査役」の節と、`factory-critique.md`（審査の結果）を読む
            2. 指摘を効く順に直す。試作（`factory-proto/*.html`）を直し、`node .github/scripts/shot.mjs --out factory-proto/shots factory-proto/*.html` で撮り直して、画像を全部 Read で見る。
               方向そのものが弱いと言われたら、小手先で直さず、方向から描き直してよい（写真・シェーダー・3D も使ってよい）
            3. `factory-design.md` を、最後の試作に合わせて直す。`factory-libs.txt` も要れば直す
            ほかのファイルは作らない（`factory-critique.md` は消さない・書き換えない）。
          claude_args: '--model opus --max-turns 70 --allowedTools "Read,Write,Edit,Glob,Grep,Skill,WebSearch,WebFetch,Bash(node .claude/skills/taste-skill/scripts/draw.mjs:*),Bash(node .claude/skills/taste-skill/scripts/inspect.mjs:*),Bash(node .github/scripts/shot.mjs:*),Bash(.github/scripts/fetch-photos.sh:*)"'
      # 審査役 2 回目：仕様・試作の HTML・前の採点を隠して、画像だけを見せる（作った側の意図を読み込ませない）
      - name: 審査役に見せない物を隠す（2 回目）
        id: hide2
        if: steps.fix1.outcome == 'success'
        run: .github/scripts/factory-blind.sh hide
      - uses: anthropics/claude-code-action@v1
        id: critic2
        continue-on-error: true
        if: steps.hide2.outcome == 'success'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは、厳しいことで知られるアートディレクターです。新しいWebサービスの試作を、**画像だけ**で審査してください。
            作った人の説明・仕様・コードは見せません（見ないでください。開いてよいのは `factory-proto/shots/` の画像と `factory-proto/photos/` の写真だけ）。
            - サービス名：${{ needs.plan.outputs.name }}
            - 説明：${{ needs.plan.outputs.desc }}
            - 元のメモ：${{ needs.plan.outputs.memo }}
            - 詳しいメモ（載せたい中身・見た目のスタイルなど。あればこれも守る）：
              ${{ needs.plan.outputs.detail }}

            手順：
            1. `factory-proto/shots/` の画像を全部 Read で見る（名前の末尾が幅：390 はスマホ、1440・1920 は PC）
            2. 賞を取るサイト（Awwwards の Site of the Day）と並べたつもりで、10点満点で採点する。目安：
               9＝賞を取る／8＝プロの仕事で、記憶に残る／7＝きれいだが既視感がある／6＝テンプレートっぽい／5以下＝AIが作った感・素人っぽい
               見る所：一目で何のサイトか・誰のための物か／主役が強いか／構図と余白と揃い／文字の質と階層／色と質感（安っぽいぼかし・のっぺりした面・ありがちな飾りは減点）／
               題材らしさ（ほかのサービスに名前を変えても成り立つなら減点）／スマホでも成立するか／メモで見た目のスタイルが指定されていれば、本当にそのスタイルに見えるか
               甘くしない。迷ったら低い方にする
            3. `factory-critique.md` に書く（このファイルだけを書く）。形：
               1行目 `点数: 7.5`（数字だけ）、2行目 `判定: 通す`（8.0 以上）か `判定: 直す`（8.0 未満）
               そのあと `## 直すこと` に、効く順に最大6個。どの画像の・どこが・なぜだめで・どう変えるとよいかを具体的に。方向そのものが弱いなら、1個目にそう書く
          claude_args: '--model opus --max-turns 25 --allowedTools "Read,Glob,Write"'
      - name: 隠した物を戻して、点数を読む（2 回目）
        id: judge2
        if: always() && steps.hide2.outcome == 'success'
        run: |
          .github/scripts/factory-blind.sh restore
          score=$(grep -m1 -E '^点数' factory-critique.md 2> /dev/null | grep -oE '[0-9]+(\.[0-9]+)?' | head -1)
          echo "審査役の点数：${score:-なし}"
          # 点数が読めない（審査役が失敗した）ときは、直しに回さずに進める
          if [ -n "$score" ] && awk -v s="$score" 'BEGIN { exit !(s < 8.0) }'; then echo "redo=true" >> "$GITHUB_OUTPUT"; else echo "redo=false" >> "$GITHUB_OUTPUT"; fi
      - uses: anthropics/claude-code-action@v1
        id: fix2
        continue-on-error: true
        if: steps.judge2.outputs.redo == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたはこのサービスのデザイン部門です。描いた試作を、仕様も見ない別のAI（審査役）が画像だけで審査し、8点に届きませんでした。
            - サービス名：${{ needs.plan.outputs.name }}
            - 説明：${{ needs.plan.outputs.desc }}
            - 元のメモ：${{ needs.plan.outputs.memo }}
            - 詳しいメモ（載せたい中身・見た目のスタイルなど。あればこれも守る）：
              ${{ needs.plan.outputs.detail }}

            1. `.github/factory/design-department.md` の「審査役」の節と、`factory-critique.md`（審査の結果）を読む
            2. 指摘を効く順に直す。試作（`factory-proto/*.html`）を直し、`node .github/scripts/shot.mjs --out factory-proto/shots factory-proto/*.html` で撮り直して、画像を全部 Read で見る。
               方向そのものが弱いと言われたら、小手先で直さず、方向から描き直してよい（写真・シェーダー・3D も使ってよい）
            3. `factory-design.md` を、最後の試作に合わせて直す。`factory-libs.txt` も要れば直す
            ほかのファイルは作らない（`factory-critique.md` は消さない・書き換えない）。
          claude_args: '--model opus --max-turns 70 --allowedTools "Read,Write,Edit,Glob,Grep,Skill,WebSearch,WebFetch,Bash(node .claude/skills/taste-skill/scripts/draw.mjs:*),Bash(node .claude/skills/taste-skill/scripts/inspect.mjs:*),Bash(node .github/scripts/shot.mjs:*),Bash(.github/scripts/fetch-photos.sh:*)"'
      # 審査役 3 回目（最後の点数を残すだけ。直しには回さない）：仕様・試作の HTML・前の採点を隠して、画像だけを見せる（作った側の意図を読み込ませない）
      - name: 審査役に見せない物を隠す（3 回目）
        id: hide3
        if: steps.fix2.outcome == 'success'
        run: .github/scripts/factory-blind.sh hide
      - uses: anthropics/claude-code-action@v1
        id: critic3
        continue-on-error: true
        if: steps.hide3.outcome == 'success'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            あなたは、厳しいことで知られるアートディレクターです。新しいWebサービスの試作を、**画像だけ**で審査してください。
            作った人の説明・仕様・コードは見せません（見ないでください。開いてよいのは `factory-proto/shots/` の画像と `factory-proto/photos/` の写真だけ）。
            - サービス名：${{ needs.plan.outputs.name }}
            - 説明：${{ needs.plan.outputs.desc }}
            - 元のメモ：${{ needs.plan.outputs.memo }}
            - 詳しいメモ（載せたい中身・見た目のスタイルなど。あればこれも守る）：
              ${{ needs.plan.outputs.detail }}

            手順：
            1. `factory-proto/shots/` の画像を全部 Read で見る（名前の末尾が幅：390 はスマホ、1440・1920 は PC）
            2. 賞を取るサイト（Awwwards の Site of the Day）と並べたつもりで、10点満点で採点する。目安：
               9＝賞を取る／8＝プロの仕事で、記憶に残る／7＝きれいだが既視感がある／6＝テンプレートっぽい／5以下＝AIが作った感・素人っぽい
               見る所：一目で何のサイトか・誰のための物か／主役が強いか／構図と余白と揃い／文字の質と階層／色と質感（安っぽいぼかし・のっぺりした面・ありがちな飾りは減点）／
               題材らしさ（ほかのサービスに名前を変えても成り立つなら減点）／スマホでも成立するか／メモで見た目のスタイルが指定されていれば、本当にそのスタイルに見えるか
               甘くしない。迷ったら低い方にする
            3. `factory-critique.md` に書く（このファイルだけを書く）。形：
               1行目 `点数: 7.5`（数字だけ）、2行目 `判定: 通す`（8.0 以上）か `判定: 直す`（8.0 未満）
               そのあと `## 直すこと` に、効く順に最大6個。どの画像の・どこが・なぜだめで・どう変えるとよいかを具体的に。方向そのものが弱いなら、1個目にそう書く
          claude_args: '--model opus --max-turns 25 --allowedTools "Read,Glob,Write"'
      - name: 隠した物を戻して、点数を読む（3 回目）
        id: judge3
        if: always() && steps.hide3.outcome == 'success'
        run: |
          .github/scripts/factory-blind.sh restore
          score=$(grep -m1 -E '^点数' factory-critique.md 2> /dev/null | grep -oE '[0-9]+(\.[0-9]+)?' | head -1)
          echo "審査役の点数：${score:-なし}"
          # 点数が読めない（審査役が失敗した）ときは、直しに回さずに進める
          if [ -n "$score" ] && awk -v s="$score" 'BEGIN { exit !(s < 8.0) }'; then echo "redo=true" >> "$GITHUB_OUTPUT"; else echo "redo=false" >> "$GITHUB_OUTPUT"; fi
      - name: 書いた物を取っておく
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/design"
          if [ -f factory-design.md ] && [ ! -L factory-design.md ]; then cp factory-design.md "$RUNNER_TEMP/design/design.md"; fi
          if [ -f factory-context.md ] && [ ! -L factory-context.md ]; then cp factory-context.md "$RUNNER_TEMP/design/context.md"; fi
          if [ -f factory-libs.txt ] && [ ! -L factory-libs.txt ]; then cp factory-libs.txt "$RUNNER_TEMP/design/libs.txt"; fi
          if [ -f factory-critique.md ] && [ ! -L factory-critique.md ]; then cp factory-critique.md "$RUNNER_TEMP/design/critique.md"; fi
          # 取った写真（試作で使った物だけを、build ジョブが入れる）
          mkdir -p "$RUNNER_TEMP/design/photos"
          for f in factory-proto/photos/*; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then cp "$f" "$RUNNER_TEMP/design/photos/"; fi
          done
          # 試作と、その最後の画像（目標の絵）。形は build ジョブ（factory.sh）がもう一度確かめる
          mkdir -p "$RUNNER_TEMP/design/ref"
          for f in factory-proto/*.html factory-proto/shots/*.png; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then cp "$f" "$RUNNER_TEMP/design/ref/"; fi
          done
          touch "$RUNNER_TEMP/design/.keep"
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: factory-design
          path: ${{ runner.temp }}/design
          include-hidden-files: true
          retention-days: 3

  build:
    # 安全のため別のジョブにする：強い鍵（FACTORY_TOKEN）は、AIが動いたジョブには渡さない。スクリプトは main の物を動かす。
    # 強い鍵は Environment「factory」（main からだけ使える）に置く。AIが作ったブランチのワークフローからは読めない
    needs: [plan, design]
    # 見た目の段が飛ばされた（Python）・失敗した（雛形のまま進める）ときも作る
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    environment: factory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      # デザイン部門が GSAP・Lenis を選んだときに npm install する
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        if: needs.design.result == 'success'
        continue-on-error: true
        with:
          name: factory-design
          path: ${{ runner.temp }}/design
      - name: 鍵があるか確かめる
        env:
          HAS_FACTORY: ${{ secrets.FACTORY_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "$HAS_FACTORY" != true ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="⚠️ 新しいサービスを作るには、最初の1回だけ、Environment「factory」の Secret に FACTORY_TOKEN が要ります（作り方は docs/pipeline.md の「工場」）。登録したら、このIssueを閉じて、同じ1行でもう一度作ってください。" > /dev/null
            echo "::error::FACTORY_TOKEN がありません"; exit 1
          fi
      - name: 新しいサービスを作る
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          COMMENT_TOKEN: ${{ github.token }}
          TEMPLATE: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          MEMO: ${{ needs.plan.outputs.memo }}
          MEMO_DETAIL: ${{ needs.plan.outputs.detail }}
          APP_NAME: ${{ needs.plan.outputs.name }}
          APP_STACK: ${{ needs.plan.outputs.stack }}
          APP_DESC: ${{ needs.plan.outputs.desc }}
          S_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          S_PIPELINE_APP_PRIVATE_KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
          S_PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
          S_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          S_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          V_PIPELINE_APP_ID: ${{ vars.PIPELINE_APP_ID }}
          V_NOTIFY_EVENTS: ${{ vars.NOTIFY_EVENTS }}
          V_AGENT_DESK_URL: ${{ vars.AGENT_DESK_URL }}
          V_VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          DESIGN_FILE: ${{ runner.temp }}/design/design.md
          CONTEXT_FILE: ${{ runner.temp }}/design/context.md
          LIBS_FILE: ${{ runner.temp }}/design/libs.txt
          DESIGN_REF_DIR: ${{ runner.temp }}/design/ref
          PHOTOS_DIR: ${{ runner.temp }}/design/photos
          CRITIQUE_FILE: ${{ runner.temp }}/design/critique.md
        run: .github/scripts/factory.sh

  # AIが名前を決められなかったときも、黙って終わらない
  report-plan-failure:
    needs: plan
    if: failure() && needs.plan.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="⚠️ 新しいサービスの名前と言語を、AIが決められませんでした（Actions の Factory の実行を見てください）。このIssueを閉じて、同じ1行でもう一度作れます。" > /dev/null
